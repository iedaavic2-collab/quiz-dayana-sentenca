<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qual é a sua sentença? · Dayana Martins</title>
<link rel="preload" as="image" href="img/genero-homem.jpg" fetchpriority="high">
<link rel="preload" as="image" href="img/genero-mulher.jpg" fetchpriority="high">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: uma tela = uma altura de celular. Coluna única (máx. 480px) em flex vertical:
   topo fixo em altura, conteúdo que encolhe (fotos absorvem a sobra), botão no rodapé dentro da safe area.
   Regra: nada rola. Se a tela não couber, os blocos marcados com data-drop somem por prioridade.
   Visual único e claro por escolha (clone do Home Sales), versão da Dra. Dayana Martins (quiz "Qual é a sua sentença?"). */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #030712;
  --muted: #6b7280;
  --line: #e5e7eb;
  --soft: #f3f4f6;
  --navy: #14213f;
  --navy-soft: #eef1f8;
  --money: #16a34a;
  --money-soft: #ecfdf3;
  --money-line: #bbf7d0;
  --alert: #dc2626;
  --alert-soft: #fef2f2;
  --alert-line: #fecaca;
  --ico-line: #4ade80;
  --ico-soft: rgba(255, 255, 255, .14);
  --ph-bg: #f6f7fb;
  --ph-line: #b8c0d6;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --gap: clamp(8px, 1.6dvh, 14px);
  --pad: clamp(9px, 1.7dvh, 14px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--muted); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }

.app { height: 100%; max-width: 480px; margin: 0 auto; padding-inline: 16px; display: flex; flex-direction: column; }

/* topo */
.top { flex: none; display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 8px; padding-block: clamp(6px, 1.4dvh, 12px); }
.back { width: 32px; height: 32px; border: 0; background: transparent; color: var(--ink); font-size: 20px; cursor: pointer; border-radius: 8px; }
.back:disabled { visibility: hidden; }
.back:focus-visible, .opt:focus-visible, .pic:focus-visible, .cta:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 99px; transition: width .35s ease; }

/* área da tela */
main { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); padding-bottom: 12px; overflow: hidden; animation: in .28s ease both; }
.screen > * { flex: none; }
.screen > .fill { flex: 1 1 0; min-height: 110px; }
.pics.four.fill { min-height: 190px; }
.screen.center-y { justify-content: center; }

/* tipografia */
.banner { background: #fffbeb; color: #92400e; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; text-align: center; padding: 6px 10px; border-radius: 8px; }
h1 { color: var(--ink); font-size: clamp(19px, 3.3dvh, 26px); line-height: 1.12; font-weight: 800; text-align: center; text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 { color: var(--ink); font-size: clamp(17px, 2.9dvh, 21px); line-height: 1.22; font-weight: 700; text-align: center; margin: 0; text-wrap: balance; }
.sub { text-align: center; font-size: clamp(11.5px, 1.8dvh, 13px); font-weight: 600; text-transform: uppercase; margin: 0; text-wrap: balance; }
.hint { text-align: center; font-size: 13px; margin: -4px 0 0; }
.go { text-align: center; font-size: 11.5px; letter-spacing: .04em; }
.hl-money { color: var(--money); }
.hl-alert { color: var(--alert); }
u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.lead { color: var(--ink); font-size: clamp(13px, 2dvh, 15px); text-align: center; margin: 0; text-wrap: pretty; }
.badge { align-self: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); background: var(--navy-soft); padding: 4px 9px; border-radius: 6px; }

/* opções */
.opts { display: grid; gap: clamp(6px, 1.1dvh, 10px); }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: var(--pad) 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .1s; }
.opt:hover { border-color: #9ca3af; }
.opt:active { transform: scale(.99); }
.opt.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.opt .em { font-size: 20px; width: 26px; text-align: center; flex: none; }
.opt .tx { min-width: 0; }
.opt .tx small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.opt .box { margin-left: auto; width: 20px; height: 20px; border: 1.5px solid #9ca3af; border-radius: 5px; flex: none; display: grid; place-items: center; font-size: 13px; color: #fff; }
.opt.on .box { background: var(--ink); border-color: var(--ink); }

/* cards com foto: a grade ocupa a sobra da tela e as fotos se ajustam */
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pics.two { grid-template-rows: minmax(0, 1fr); }
.pics.four { grid-template-rows: repeat(2, minmax(0, 1fr)); }
.pic { display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font: inherit; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.pic:hover { border-color: #9ca3af; }
.pic.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.pic .ph-img { flex: 1 1 0; min-height: 0; background: #f8f8f8; }
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 28%; }
.pic .lbl { flex: none; padding: clamp(7px, 1.3dvh, 11px) 8px; font-size: 14px; font-weight: 500; text-align: center; background: var(--soft); }

/* fotos e inserções */
.media { border-radius: 12px; overflow: hidden; background: var(--navy); }
.media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.media.wp img { object-position: 50% 30%; }
.media.wl img { object-position: 24% 25%; }
.media.wb img { object-position: 50% 22%; }
.media.wc img { object-position: 50% 30%; }
.media.nb img { object-position: 62% 45%; }
.media.ps img { object-position: 50% 45%; }
.media.wa img { object-position: 45% 25%; }
.media.wp2 img { object-position: 45% 30%; }
.media.wbt img { object-position: 50% 18%; }
.media.cap img { object-position: 50% 22%; }
.media.wm img { object-position: 50% 22%; }
.media.mk { background: #0b1b2e; }
.media.vid { background: #000; position: relative; }
.unmute { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); border: 0; border-radius: 999px; background: rgba(3, 7, 18, .78); color: #fff; font: inherit; font-size: 13px; font-weight: 700; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.media.pix { position: relative; background: #e5e7eb; }
.media.pix img { object-position: 50% 38%; }
.ilus { position: absolute; right: 8px; bottom: 8px; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: #fff; background: rgba(3,7,18,.6); padding: 3px 7px; border-radius: 4px; }
.media.vid video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
.media.doc { background: #fff; border: 1px solid var(--line); }
.media.doc img { object-position: 50% 0%; }
.media.mk:not(.gq) { background: none; border-radius: 0; display: flex; align-items: center; justify-content: center; min-height: 0; }
.media.mk:not(.gq) img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: unset; border-radius: 12px; }
.media.mk.gq img { object-fit: cover; object-position: 50% 40%; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vs-col { display: grid; gap: 3px; align-content: start; border-radius: 10px; padding: clamp(8px, 1.4dvh, 12px) 11px; font-size: 12.5px; color: var(--ink); }
.vs-col b { font-size: 13px; margin-bottom: 2px; }
.vs-col span::before { margin-right: 5px; font-weight: 800; }
.vs-col.bad { background: var(--alert-soft); border: 1px solid var(--alert-line); }
.vs-col.bad span::before { content: "✕"; color: var(--alert); }
.vs-col.good { background: var(--money-soft); border: 1px solid var(--money-line); }
.vs-col.good span::before { content: "✓"; color: var(--money); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo > * { min-height: 0; height: 100%; }
.ph { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; text-align: center; padding: 10px; background: var(--ph-bg); border: 1.5px dashed var(--ph-line); border-radius: 12px; color: #4b5577; font-size: 11.5px; line-height: 1.3; overflow: hidden; }
.ph .tag { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; color: var(--navy); background: #dfe5f3; padding: 3px 6px; border-radius: 4px; }
.ph strong { color: var(--ink); font-size: 12.5px; font-weight: 600; }

.facts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.facts li { display: flex; gap: 9px; align-items: flex-start; font-size: clamp(12.5px, 1.9dvh, 14px); color: var(--ink); background: #f9fafb; border: 1px solid var(--line); border-radius: 10px; padding: clamp(7px, 1.2dvh, 10px) 11px; }
.facts.tight { gap: 2px; } .facts.tight li { background: none; border: 0; padding: 2px 4px; }
.facts .ck { color: var(--money); font-weight: 800; flex: none; }
.quote { background: var(--navy); color: #fff; border-radius: 12px; padding: clamp(10px, 1.7dvh, 15px) 15px; font-size: clamp(13px, 2dvh, 15px); line-height: 1.4; font-weight: 500; }
.quote cite { display: block; margin-top: 6px; font-style: normal; font-size: 11.5px; color: #c7d0e6; font-weight: 400; }
.echo { background: var(--money-soft); border: 1px solid var(--money-line); color: #14532d; border-radius: 10px; padding: clamp(8px, 1.4dvh, 12px) 12px; font-size: 13.5px; text-align: center; }
.echo b { color: var(--money); }

/* rodapé: no fluxo, sempre visível, dentro da safe area */
.foot { flex: none; padding-block: 8px calc(14px + env(safe-area-inset-bottom, 0px)); }
.cta { display: block; width: 100%; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font: inherit; font-size: 15px; font-weight: 600; padding: clamp(12px, 2dvh, 15px); cursor: pointer; }
.cta:disabled { background: #d1d5db; cursor: not-allowed; }

.real { align-self: center; background: var(--money); color: #fff; font-weight: 800; font-size: clamp(18px, 3dvh, 22px); text-align: center; padding: 12px 18px; border-radius: 12px; letter-spacing: .01em; }
.calc { display: grid; justify-items: center; gap: 4px; border: 2px solid var(--money); border-radius: 14px; padding: clamp(12px, 2.4dvh, 20px) 14px; text-align: center; }
.calc span { color: var(--ink); font-size: clamp(24px, 4.4dvh, 32px); font-weight: 800; line-height: 1.1; }
.calc small { font-size: 13px; color: var(--muted); }
.load { display: grid; gap: 8px; }
.load-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink); }
.load-top b { font-variant-numeric: tabular-nums; }
.load-bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.load-bar i { display: block; height: 100%; width: 0; background: var(--money); border-radius: 99px; }

.selo { background: var(--money); color: #fff; font-weight: 800; font-size: clamp(13px, 2.1dvh, 16px); line-height: 1.25; text-align: center; padding: clamp(9px, 1.6dvh, 13px) 14px; border-radius: 12px; text-wrap: balance; }
.cmp, .ad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp-col, .ad-col { display: grid; gap: 6px; align-content: start; min-width: 0; }
.ad-col { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 10px; }
.ad-col.good { border-color: var(--money); box-shadow: 0 0 0 1px var(--money); }
.who { position: relative; flex: 1 1 0; min-height: 64px; border-radius: 8px; overflow: hidden; background: var(--soft); }
.who img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
.who.bad::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(127, 29, 29, .45), rgba(127, 29, 29, 0) 55%); }
.who.good::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(20, 83, 45, .5), rgba(20, 83, 45, 0) 55%); }
.who .cap { position: absolute; z-index: 1; left: 6px; right: 6px; bottom: 6px; color: #fff; font-size: 11px; font-weight: 700; line-height: 1.2; text-align: center; }
.cmp-h { font-size: 12px; text-align: center; padding: 5px; border-radius: 6px; }
.cmp-h.bad { background: var(--alert-soft); color: var(--alert); }
.cmp-h.good { background: var(--money-soft); color: var(--money); }
.br { display: grid; gap: 3px; font-size: 11.5px; color: var(--ink); }
.br-t { height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
.br-t i { display: block; height: 100%; border-radius: 99px; }
.br-t i.bad { background: var(--alert); }
.br-t i.good { background: var(--money); }
.said { color: var(--ink); font-size: 14px; }
.bad-echo { background: var(--alert-soft); border-color: var(--alert-line); color: #7f1d1d; }
.bad-echo b { color: var(--alert); }
.rot { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: r; }
.rot li { counter-increment: r; display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: clamp(9px, 1.6dvh, 13px) 12px; color: var(--ink); }
.rot li::before { content: counter(r); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; font-weight: 800; }
.rot li b { font-size: 15px; }
.rot li span { font-size: 12.5px; color: var(--muted); }
.rot li.me { border-color: var(--money); box-shadow: 0 0 0 1px var(--money); background: var(--money-soft); }
.rot li.me::before { background: var(--money); }
.trilha { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); border-left: 3px solid var(--line); margin-left: 10px; padding-left: 18px; }
.tr-step { position: relative; display: grid; align-content: center; gap: 1px; }
.tr-step i { position: absolute; left: -27px; top: 50%; width: 15px; height: 15px; margin-top: -8px; border-radius: 50%; background: var(--bg); border: 3px solid var(--navy); }
.tr-step b { color: var(--ink); font-size: 14px; }
.tr-step span { font-size: 12px; }
.tr-step.goal i { background: var(--money); border-color: var(--money); }
.tr-step.goal b { color: var(--money); }
.lead-form { display: grid; gap: 10px; }
.lead-form label { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.lead-form input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid #d1d5db; border-radius: 10px; padding: 11px 12px; width: 100%; }
.lead-form input:focus { outline: 2px solid var(--navy); outline-offset: 1px; border-color: var(--navy); }
.err { margin: 0; color: var(--alert); font-size: 13px; font-weight: 600; }
.plist { gap: clamp(6px, 1.2dvh, 12px); }
.plist li { font-size: clamp(12px, 2.1dvh, 16px); line-height: 1.3; padding: 5px 10px 5px 5px; gap: 10px; }
.plist li { align-items: center; padding: 6px 10px 6px 6px; min-height: 0; }
.th { flex: none; width: clamp(40px, 9dvh, 104px); aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: var(--soft); }
.th img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
.th.doc img { object-position: center top; }
.th.ico svg { display: block; width: 100%; height: 100%; }
.th.ico svg text { stroke: none; font-family: var(--font); }

/* ===== Fase 5 · página de oferta (visual escuro e dourado, modelado na referência) ===== */
:root { --p-bg: #07090f; --p-card: #10141f; --p-line: rgba(255, 255, 255, .1); --p-text: #f3f4f6; --p-muted: #a3a9b8; --gold-1: #f6dc95; --gold-2: #d4a24c; }
body.pitch-mode { background: var(--p-bg); }
body.pitch-mode .back { color: var(--p-text); }
body.pitch-mode .bar { background: rgba(255, 255, 255, .14); }
body.pitch-mode .bar > i { background: linear-gradient(90deg, var(--gold-1), var(--gold-2)); }
body.pitch-mode .cta { background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); color: #1a1205; font-weight: 800; letter-spacing: .02em; box-shadow: 0 0 24px rgba(233, 196, 106, .35); border-radius: 999px; }
body.pitch-mode .foot { background: linear-gradient(to top, var(--p-bg) 75%, rgba(7, 9, 15, 0)); }
.screen.scroll { display: block; overflow-y: auto; overflow-x: hidden; padding-bottom: 24px; color: var(--p-muted); scrollbar-width: none; }
.screen.scroll::-webkit-scrollbar { display: none; }
.p-hero { display: grid; gap: 14px; text-align: center; padding-bottom: 8px; }
.p-photo { margin-inline: -16px; aspect-ratio: 4 / 4.2; max-height: 52dvh; position: relative; overflow: hidden; }
.p-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; display: block; }
.p-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(7, 9, 15, 0) 45%, var(--p-bg) 98%); }
.p-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: -64px; position: relative; z-index: 1; }
.p-logo svg { width: 46px; height: 46px; flex: none; }
.p-logo svg text { font-family: var(--font); }
.p-logo div { display: grid; text-align: left; line-height: 1.05; }
.p-logo small { font-size: 10.5px; color: var(--p-muted); letter-spacing: .04em; }
.p-logo b { font-size: 20px; color: var(--p-text); letter-spacing: .01em; }
.p-hero hr { border: 0; height: 1px; background: var(--p-line); margin: 2px 0; }
.p-h1 { color: var(--p-text); font-size: clamp(21px, 5.6vw, 26px); line-height: 1.22; font-weight: 600; margin: 0; text-transform: none; text-align: center; text-wrap: balance; }
.gold { background: linear-gradient(90deg, var(--gold-1), var(--gold-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.p-sub { margin: 0; font-size: 15px; line-height: 1.6; color: var(--p-muted); text-wrap: pretty; }
.p-sub b, .p-txt b { color: var(--p-text); }
.p-btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 17px 16px; font: inherit; font-size: 16px; font-weight: 800; letter-spacing: .02em; color: #1a1205; background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); box-shadow: 0 0 28px rgba(233, 196, 106, .35); cursor: pointer; }
.p-btn:focus-visible { outline: 2px solid var(--p-text); outline-offset: 3px; }
.p-mini { margin: 0; font-size: 12px; letter-spacing: .1em; color: var(--p-muted); text-align: center; }
.p-sec { display: grid; gap: 14px; padding-block: 28px; border-top: 1px solid var(--p-line); }
.p-h2 { color: var(--p-text); font-size: 21px; line-height: 1.25; font-weight: 700; margin: 0; text-align: center; text-wrap: balance; }
.p-txt { margin: 0; font-size: 15px; line-height: 1.6; }
.p-check { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.p-check li { position: relative; padding-left: 28px; font-size: 14.5px; line-height: 1.5; color: var(--p-text); }
.p-check li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #1a1205; background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); }
.p-check li b { color: var(--gold-1); }
.p-img { border-radius: 14px; overflow: hidden; }
.p-img img { display: block; width: 100%; height: auto; }
.p-quote { margin: 0; padding: 14px 16px; border-left: 3px solid var(--gold-2); background: var(--p-card); border-radius: 0 10px 10px 0; color: var(--p-text); font-size: 15px; font-style: italic; }
.rot.dark li { background: var(--p-card); border-color: var(--p-line); color: var(--p-text); }
.rot.dark li::before { background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); color: #1a1205; }
.rot.dark li span { color: var(--p-muted); }
.p-steps { display: grid; gap: 10px; }
.p-step { background: var(--p-card); border: 1px solid var(--p-line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.p-tag { justify-self: start; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-1); }
.p-step ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; color: var(--p-text); font-size: 14px; }
.p-step li::marker { color: var(--gold-2); font-weight: 700; }

        <img class="ck-cover" src="img/dayana-avatar-toga.jpg" alt="Dayana Martins">
        <div><b>Os 7 Códigos da Aprovação</b><small>8 aulas + 5 bônus · acesso por e-mail</small><p class="ck-price">R$47</p></div>
      </div>
      <form class="ck-form" id="ck" novalidate>
        <h3 class="ck-h">1. Seus dados</h3>
        <label for="ck-nome">Nome completo<input id="ck-nome" type="text" autocomplete="name" value="${esc(A.nome || "")}" placeholder="Seu nome completo"></label>
        <label for="ck-email">E-mail<input id="ck-email" type="email" autocomplete="email" value="${esc(A.email || "")}" placeholder="Seu melhor e-mail"></label>
        <div class="ck-2">
          <label for="ck-cpf">CPF<input id="ck-cpf" type="text" inputmode="numeric" placeholder="000.000.000-00"></label>
          <label for="ck-whats">WhatsApp<input id="ck-whats" type="tel" value="${esc(A.whats || "")}" placeholder="(62) 99999-9999"></label>
        </div>
        <h3 class="ck-h">2. Pagamento</h3>
        <div class="ck-pay" role="tablist">
          <button type="button" class="on" data-pay="pix" role="tab" aria-selected="true">Pix</button>

        </div>
        <div class="ck-panel" data-panel="pix"><p>✓ Aprovação imediata. O QR Code aparece depois de finalizar.</p></div>
        <div class="ck-panel" data-panel="cartao" hidden>
          <p class="ck-note">No protótipo os campos do cartão ficam desativados. Na página real eles vêm da plataforma de pagamento.</p>
          <label>Número do cartão<input type="text" disabled placeholder="•••• •••• •••• ••••"></label>
          <div class="ck-2"><label>Validade<input type="text" disabled placeholder="MM/AA"></label><label>CVV<input type="text" disabled placeholder="•••"></label></div>
        </div>
        <div class="ck-sum"><div class="tot"><span>Total</span><b>R$47,00</b></div></div>
        <p class="ck-err" id="ck-err" role="alert" hidden></p>
      </form>
      <div class="ck-trust">
        <div><b>🛡️ Garantia de 7 dias</b><small>100% do seu dinheiro de volta</small></div>
        <div><b>⚡ Acesso por e-mail</b><small>logo após a compra</small></div>
      </div>
      <p class="ck-legal">Ao finalizar, você concorda com os Termos de Uso e a Política de Privacidade. Vendido por ${TBD} · CNPJ ${TBD}.</p>`,
    onShow: () => {
      app.querySelectorAll("[data-pay]").forEach(b => b.addEventListener("click", () => {
        app.querySelectorAll("[data-pay]").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); });
        app.querySelectorAll("[data-panel]").forEach(pnl => pnl.hidden = pnl.dataset.panel !== b.dataset.pay);
      }));
      const cpf = document.getElementById("ck-cpf");
      cpf.addEventListener("input", () => { const d = cpf.value.replace(/\D/g, "").slice(0, 11); cpf.value = d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2"); });
      document.getElementById("ck").addEventListener("submit", e => { e.preventDefault(); cta.click(); });
    },
    onCta: () => {
      const err = document.getElementById("ck-err");
      const miss = [["ck-nome", "o nome completo"], ["ck-email", "o e-mail"], ["ck-cpf", "o CPF"]].find(([id]) => !document.getElementById(id).value.trim());
      if (miss) { err.textContent = `Preencha ${miss[1]} para continuar.`; err.hidden = false; document.getElementById(miss[0]).focus(); return false; }
      err.hidden = true;
      A.nome = (document.getElementById("ck-nome").value.trim().split(" ")[0]) || A.nome;
      return true;
    } },

  /* ================= OBRIGADO + PRÓXIMO PASSO ================= */
  { id: "obrigado", scroll: true, cta: "QUERO ENTRAR NA LISTA VIP", render: () => {
      const nome = esc(A.nome || "");
      const t = travado();
      return `
      <div class="ty-ok"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="var(--money)"/><path d="M19 33l9 9 17-19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 class="v-h1">${nome ? nome + ", sua" : "Sua"} compra foi confirmada!</h1>
      <p class="v-p center">A partir de agora, você não está mais ${g("sozinho", "sozinha")} até a prova.</p>
      <div class="ck-prod ty-prod">
        <img class="ck-cover" src="img/dayana-avatar-toga.jpg" alt="Dayana Martins">
        <div><span class="v-pill">ACESSO LIBERADO</span><b>Os 7 Códigos da Aprovação</b><small>8 aulas + 5 bônus</small></div>
      </div>
      ${ph("VÍDEO", "Boas-vindas da Dayana (até 1 min)", "O que fazer nas próximas 24 horas. Gravar junto com as aulas.", "ty-vid")}
      <h2 class="v-h2">SEUS PRÓXIMOS 3 PASSOS</h2>
      <ol class="ty-steps">
        <li><b>Abra o seu e-mail</b><span>O acesso chega em ${esc(A.email || "seu e-mail")}. Confira também o spam.</span></li>
        <li><b>Fique de olho no WhatsApp</b><span>Também mandamos o link em ${esc(A.whats || "seu WhatsApp")}.</span></li>
        <li><b>Assista à Aula ${COD[t].aula} ainda hoje</b><span>${COD[t].nome}: é por ela que a sua sentença começa.</span></li>
      </ol>
      <div class="ty-vip">
        <span class="v-pill">CONVITE PARA ALUNOS</span>
        <h2 class="v-h2" style="margin-top:6px !important">Quer se preparar para a magistratura com acompanhamento de perto?</h2>
        <div class="v-img"><img src="img/dayana-toga.jpg" alt="Dayana Martins de toga"></div>
        <p class="v-p">A próxima etapa é a <b>Mentoria Método Aprovação</b>: acompanhamento ao vivo para estudar com estratégia, constância e direção. Nome, data e formato ${TBD}.</p>
        <ul class="v-best">
          <li>Encontros ao vivo com a Dayana</li>
          <li>Plano, revisão e correção de rota</li>
          <li>Prioridade para quem está na lista VIP</li>
        </ul>
        <button type="button" class="v-buy" data-vip>QUERO ENTRAR NA LISTA VIP</button>
        <p class="ck-legal">A lista VIP é gratuita. Você recebe os avisos no WhatsApp.</p>
      </div>
      <div class="ty-insta"><b>Siga a Dayana no Instagram</b><span>@dayanamartinsoficial</span></div>
      <footer class="v-foot"><p>Dúvidas sobre o acesso: suporte ${TBD}</p></footer>`; },
    onShow: () => app.querySelectorAll("[data-vip]").forEach(b => b.addEventListener("click", () => cta.click())),
    onCta: () => { toast("Link do grupo VIP no WhatsApp · a definir"); return false; } }
];
S.forEach((s, i) => { s.n = i + 1; });
const TOTAL = S.length;

/* pré-carrega as fotos em segundo plano */
const IMGS = ["genero-homem", "genero-mulher", ...["h", "m"].flatMap(x => [1, 2, 3, 4].map(n => `idade-${x}-${n}`)),
  "dayana-toga", "cena-pratica", "cena-atacante", "cena-montanha", "cena-rota", "cena-gesta", "cena-raiz", "cena-semeia", "cena-fe",
  "dayana-bracos-cruzados", "dayana-sentada", "dayana-blazer", "dayana-retrato", "dayana-branco", "dayana-avatar-toga",
  "bonus-devocional", "bonus-reprovacao", "bonus-antitrava", "bonus-diario", "livro-capa", "depo-adriana-1", "depo-adriana-2"].map(n => `img/${n}.jpg`);
const keep = [], queue = []; let busy = 0;
function pump() { while (busy < 4 && queue.length) { const src = queue.shift(); busy++; const i = new Image(); i.decoding = "async"; keep.push(i); i.onload = i.onerror = () => { busy--; pump(); }; i.src = src; } }
setTimeout(() => { queue.push(...IMGS); pump(); }, 0);

/* regra da safe area: a tela tem que caber sem rolar */
function fit() {
  const sec = app.querySelector(".screen");
  if (!sec || sec.classList.contains("scroll")) return;
  sec.querySelectorAll("[data-drop]").forEach(el => el.hidden = false);
  const drops = [...sec.querySelectorAll("[data-drop]")].sort((a, b) => b.dataset.drop - a.dataset.drop);
  const overflows = () => sec.scrollHeight > sec.clientHeight;
  while (overflows() && drops.length) drops.shift().hidden = true;
}

const app = document.getElementById("app");
const foot = document.getElementById("foot");
const cta = document.getElementById("cta");
const back = document.getElementById("back");
let cur = 0;

function show(i, push = true) {
  if (push && cur !== i) hist.push(cur);
  cur = i;
  const s = S[i];
  app.innerHTML = `<section class="screen${s.center ? " center-y" : ""}${s.scroll ? " scroll" : ""}">${s.render()}</section>`;
  document.getElementById("prog").style.width = Math.min(100, (s.n / TOTAL) * 100) + "%";
  back.disabled = hist.length === 0;
  foot.hidden = !s.cta;
  if (s.cta) { cta.textContent = s.cta; cta.disabled = s.multi ? !(A[s.multi] || []).length : false; }
  window.scrollTo(0, 0); app.scrollTop = 0;
  fit();
  if (s.onShow) s.onShow();
  app.querySelectorAll("img").forEach(img => img.complete || img.addEventListener("load", fit, { once: true }));
}
function next() { let i = cur + 1; while (i < S.length - 1 && S[i].skip && S[i].skip()) i++; if (i < S.length) show(i); }

app.addEventListener("click", e => {
  const single = e.target.closest("[data-k]");
  if (single) {
    A[single.dataset.k] = single.dataset.v;
    app.querySelectorAll(`[data-k="${single.dataset.k}"]`).forEach(b => b.classList.toggle("on", b === single));
    setTimeout(next, 180);
    return;
  }
  const m = e.target.closest("[data-multi]");
  if (m) {
    const k = m.dataset.mk, v = m.dataset.multi;
    let t = A[k] || [];
    if (v === "nada") t = t.includes("nada") ? [] : ["nada"];
    else { t = t.filter(x => x !== "nada"); t = t.includes(v) ? t.filter(x => x !== v) : [...t, v]; }
    A[k] = t;
    app.querySelectorAll(`[data-mk="${k}"]`).forEach(b => {
      const on = t.includes(b.dataset.multi);
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
      b.querySelector(".box").textContent = on ? "✓" : "";
    });
    cta.disabled = !t.length;
  }
});

cta.addEventListener("click", () => { const s = S[cur]; if (s.onCta && !s.onCta()) return; next(); });
back.addEventListener("click", () => { let i = hist.pop(); while (i !== undefined && S[i].auto && hist.length) i = hist.pop(); if (i !== undefined) show(i, false); });
addEventListener("resize", fit);
if (document.fonts) document.fonts.ready.then(fit);

/* atalhos de revisão do time: #fase2 … #fase5, #sentenca, #checkout, #obrigado ou #t12 (tela 12), com respostas de exemplo */
const EX1 = { genero: "mulher", idade: "a34", carreira: "mag", momento: "estudo", tempo: "a3", trabalho: "integral", provas: "p2", horas: "h4", fe: "sim" };
const EX2 = { rotina: "aulas", assunto: "lembra", voltas: "uma", cargo: "sonho", inscreve: "poucas", genio: "parte", voltou: "semanas", desistir: "passou", caminho: "incerto", trocas: ["material", "cronograma"], edital: "tentado", falta: "ansioso", resultado: "quase", celular: "r15", naos: "so", dias: "d20", perdeu: "culpa" };
const EX3 = { deus: "parte", cadeira: "medo", frases: ["loteria", "passa"], lista: "servir", quem: "pais" };
const EX4 = { trava: "constancia", disposicao: "muito", nome: "Ana", email: "ana@exemplo.com", whats: "(62) 99999-8888", acredita: "direcao" };
const TUDO = { ...EX1, ...EX2, ...EX3, ...EX4 };
const JUMP = { "#fase2": ["fase2", EX1], "#fase3": ["fase3", { ...EX1, ...EX2 }], "#fase4": ["fase4", { ...EX1, ...EX2, ...EX3 }], "#sentenca": ["sentenca", TUDO], "#fase5": ["fase5", TUDO], "#checkout": ["checkout", TUDO], "#obrigado": ["obrigado", TUDO] };
let jump = JUMP[location.hash];
const tN = /^#t(\d+)$/.exec(location.hash);
if (!jump && tN) { const idx = S.findIndex(x => x.n === Number(tN[1])); if (idx >= 0) { S[idx].id = S[idx].id || "t" + tN[1]; jump = [S[idx].id, TUDO]; } }
if (jump) { Object.assign(A, jump[1]); hist.push(0); show(S.findIndex(s => s.id === jump[0]), false); } else show(0, false);
addEventListener("hashchange", () => location.reload());
</script>
